<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSKi Invoicing Tool</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --danger: #e74c3c;
            --bg: #f4f7f6;
            --text: #333;
            --card-bg: #ffffff;
            --border: #ccc;
            --input-bg: #ffffff;
            --input-text: #333;
            --input-disabled: #eee;
            --preview-bg: #ffffff;
            --preview-text: #000;
            --line-border: #ddd;
            --note-text: #888;
        }

        body.dark-mode {
            --primary: #ecf0f1;
            --accent: #2980b9;
            --danger: #c0392b;
            --bg: #1a1a1a;
            --text: #e0e0e0;
            --card-bg: #2d2d2d;
            --border: #555;
            --input-bg: #3a3a3a;
            --input-text: #e0e0e0;
            --input-disabled: #222;
            --preview-bg: #2d2d2d;
            --preview-text: #e0e0e0;
            --line-border: #555;
            --note-text: #aaa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            transition: background-color 0.3s;
        }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { color: var(--primary); margin: 0; font-size: 24px; }
        
        .top-buttons { display: flex; gap: 10px; }
        .reset-btn, .theme-btn { 
            color: white; border: none; padding: 8px 16px; border-radius: 6px; 
            font-weight: 600; cursor: pointer; font-size: 14px;
        }
        .reset-btn { background: var(--danger); }
        .theme-btn { background: var(--primary); }
        .reset-btn:hover, .theme-btn:hover { opacity: 0.9; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 15px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--text); opacity: 0.8; }
        input, select, textarea {
            width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;
            font-size: 14px; box-sizing: border-box; font-family: inherit;
            background-color: var(--input-bg); color: var(--input-text);
        }
        input:focus, select:focus { outline: 2px solid var(--accent); }
        input:disabled { background-color: var(--input-disabled); color: #777; cursor: not-allowed; }
        
        button.btn-primary {
            background: var(--accent); color: white; border: none; padding: 12px 20px;
            border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer;
            width: 100%; margin-top: 20px;
        }
        button.btn-primary:hover { opacity: 0.9; }
        
        .item-row { display: grid; grid-template-columns: 3fr 1fr 1fr 1fr 40px; gap: 10px; margin-bottom: 10px; }
        .remove-btn { background: var(--danger); color: white; border: none; padding: 0; font-size: 18px; border-radius: 6px; cursor: pointer;}
        .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: var(--text); }
        .checkbox-row input { width: auto; }
        
        /* --- INVOICE PREVIEW STYLES --- */
        #invoice-preview {
            display: none;
            background: white; 
            padding: 40px; 
            color: #000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            max-width: 800px; margin: 20px auto; box-shadow: 0 0 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        
        .preview-top-row { display: flex; justify-content: space-between; margin-bottom: 40px; }
        .preview-left { width: 45%; padding-top: 45px; }
        
        .preview-right { 
            width: 45%; 
            display: flex;
            flex-direction: column;
            align-items: flex-start; 
        }
        
        .preview-title { font-size: 32px; font-weight: bold; color: #000; margin-bottom: 15px; }
        .supplier-name { font-weight: bold; font-size: 18px; margin-bottom: 5px; }
        
        .meta-data { font-size: 14px; line-height: 1.6; color: #333; margin-bottom: 25px; text-align: left; }
        
        .client-data { font-size: 14px; line-height: 1.6; color: #333; text-align: left; width: 100%; }
        .client-label { font-size: 12px; font-weight: bold; color: #888; text-transform: uppercase; margin-bottom: 5px; text-align: left; }
        
        /* Table styling */
        .table-container {
            border: 1px solid #ccc;
            border-radius: 0px;
            overflow: hidden;
            height: 350px;
            margin-top: 30px;
            display: flex;
            flex-direction: column;
        }

        .preview-table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 13px; 
            margin: 0; 
            table-layout: fixed; 
            height: 100%; 
        }
        
        .preview-table thead {
            background: #f9f9f9;
            border-bottom: 2px solid #000;
        }
        
        .preview-table th { 
            border-left: 1px solid #ddd; 
            text-align: left; 
            padding: 12px 15px; 
            color: #000; 
            box-sizing: border-box;
        }
        .preview-table th:first-child { border-left: none; }
        .preview-table th.right { text-align: right; }
        
        /* Body rows */
        .table-body-wrapper {
            display: table-row-group;
        }
        
        .preview-table td { 
            border-bottom: 1px solid #eee; 
            border-left: 1px solid #ddd; 
            padding: 12px 15px; 
            color: #000; 
            box-sizing: border-box;
            vertical-align: top;
        }
        .preview-table td:first-child { border-left: none; }
        .preview-table td.right { text-align: right; }
        
        /* Spacer row styles */
        .spacer-row td {
            border-bottom: none !important;
        }
        
        /* Totals block aligned to match the Total column */
        .totals-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
            padding-right: 15px;
        }
        
        .totals-table {
            width: 40%; 
            border-collapse: collapse;
        }
        
        .totals-table td {
            padding: 8px 0;
            font-size: 14px;
        }
        
        .totals-table td.label {
            text-align: right;
            padding-right: 15px;
            color: #333;
        }
        
        .totals-table td.value {
            text-align: right;
            width: 50%;
            color: #000;
        }
        
        .total-final {
            font-weight: bold;
            font-size: 18px;
            border-top: 2px solid #000;
            border-bottom: 2px solid #000;
            padding: 10px 0 !important;
        }
        
        .signature-block { margin-top: 60px; display: flex; justify-content: flex-start; }
        .signature-inner { text-align: center; width: 250px; }
        .signature-dots { border-bottom: 1px dotted #000; height: 40px; margin-bottom: 5px; }
        .signature-name { font-weight: bold; font-size: 14px; text-transform: uppercase; color: #000; }
        .signature-title { font-size: 12px; color: #666; }

        .footer-note { margin-top: 50px; font-size: 10px; color: #888; text-align: center; border-top: 1px solid #eee; padding-top: 10px; }
        .hidden { display: none !important; }
        
        @media (max-width: 700px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            .grid, .grid-4 { grid-template-columns: 1fr; gap: 10px; }
            
            .item-row { 
                display: flex; flex-wrap: wrap; gap: 8px;
                background: var(--bg); padding: 12px; border-radius: 8px;
                border: 1px solid var(--border); margin-bottom: 15px;
            }
            
            .item-desc { width: 100%; margin-bottom: 5px; }
            .item-qty, .item-price, .item-total { flex: 1; min-width: 0; padding: 8px; }
            .remove-btn { width: 40px; flex: none; margin-top: 0; height: auto; }
            
            .preview-top-row { flex-direction: column; }
            .preview-left, .preview-right { width: 100%; text-align: left; align-items: flex-start; }
            .preview-left { padding-top: 0; }
            .preview-right { margin-top: 20px; }
            .meta-data { text-align: left; }
            #invoice-preview { padding: 20px; }
            .totals-table { width: 100%; }
        }
    </style>
</head>
<body>

<div class="container" id="app-form">
    
    <div class="top-bar">
        <h1>OSKi Invoicing Tool</h1>
        <div class="top-buttons">
            <button type="button" class="theme-btn" onclick="toggleDarkMode()">🌓 Theme</button>
            <button type="button" class="reset-btn" onclick="resetApp(true)">Reset App</button>
        </div>
    </div>
    
    <div class="grid-4" style="margin-bottom: 20px;">
        <div>
            <label>Invoice Number</label>
            <input type="text" id="inv-number">
        </div>
        <div>
            <label>Invoice Date</label>
            <input type="date" id="inv-date">
        </div>
        <div>
            <label style="display:flex; justify-content:space-between; align-items:center;">
                Due Date
                <span style="font-weight:normal; font-size:12px; cursor:pointer;">
                    <input type="checkbox" id="toggle-due-date" checked style="width:auto; margin-right:4px; vertical-align:middle;" onchange="toggleDueDate()"> Show
                </span>
            </label>
            <input type="date" id="inv-due">
        </div>
        <div>
            <label>Currency</label>
            <select id="currency-select">
                <option value="€">EUR (€)</option>
                <option value="$">USD ($)</option>
                <option value="£">GBP (£)</option>
                <option value="CHF">CHF (CHF)</option>
                <option value="CAD$">CAD (C$)</option>
                <option value="AUD$">AUD (A$)</option>
                <option value="AED">AED (د.إ)</option>
                <option value="SAR">SAR (﷼)</option>
                <option value="QAR">QAR (ر.ق)</option>
                <option value="KWD">KWD (د.ك)</option>
                <option value="BHD">BHD (.د.ب)</option>
                <option value="OMR">OMR (ر.ع.)</option>
                <option value="ILS">ILS (₪)</option>
                <option value="¥">JPY (¥)</option>
                <option value="CNY¥">CNY (¥)</option>
                <option value="₹">INR (₹)</option>
                <option value="₩">KRW (₩)</option>
                <option value="SGD$">SGD (S$)</option>
                <option value="HKD$">HKD (HK$)</option>
                <option value="฿">THB (฿)</option>
                <option value="₫">VND (₫)</option>
                <option value="RM">MYR (RM)</option>
                <option value="Rp">IDR (Rp)</option>
                <option value="₱">PHP (₱)</option>
            </select>
        </div>
    </div>

    <div class="grid">
        <div>
            <h3 style="margin-bottom:10px;">Supplier (You)</h3>
            <label>Name / Company</label>
            <input type="text" id="sup-name" placeholder="John Doe">
            <label style="margin-top:10px;">Address</label>
            <input type="text" id="sup-address" placeholder="Street & Number">
            <input type="text" id="sup-city" placeholder="Postal Code, City, Country" style="margin-top:5px;">
            <label style="margin-top:10px;">Email</label>
            <input type="email" id="sup-email" placeholder="you@example.com">
            <label style="margin-top:10px;">Phone</label>
            <input type="tel" id="sup-phone" placeholder="+32 400 00 00 00">
            
            <div class="checkbox-row" style="margin-top: 15px; border-top: 1px solid var(--border); padding-top: 10px;">
                <input type="checkbox" id="sup-vat-toggle" checked onchange="toggleSupVat()">
                <label for="sup-vat-toggle" style="margin:0; cursor:pointer; font-weight: 600;">Show VAT Number</label>
            </div>
            <input type="text" id="sup-vat" placeholder="BE0123456789" style="margin-top: 5px;">

            <div class="checkbox-row" style="margin-top: 15px;">
                <input type="checkbox" id="sup-tic-toggle" onchange="toggleSupTic()">
                <label for="sup-tic-toggle" style="margin:0; cursor:pointer; font-weight: 600;">Show TIC</label>
            </div>
            <input type="text" id="sup-tic" placeholder="TIC Number" style="margin-top: 5px;" disabled>
            
            <div class="checkbox-row" style="margin-top: 15px; border-top: 1px solid var(--border); padding-top: 10px;">
                <input type="checkbox" id="sup-signature-toggle" checked>
                <label for="sup-signature-toggle" style="margin:0; cursor:pointer;">Include signature block on PDF</label>
            </div>
        </div>
        <div>
            <h3 style="margin-bottom:10px;">Client (Bill To)</h3>
            <label>Name / Company</label>
            <input type="text" id="cl-name">
            <label style="margin-top:10px;">Address</label>
            <input type="text" id="cl-address">
            <input type="text" id="cl-city" style="margin-top:5px;">
            <label style="margin-top:10px;">Email</label>
            <input type="email" id="cl-email">
            <label style="margin-top:10px;">Phone</label>
            <input type="tel" id="cl-phone">
            
            <label style="margin-top:10px;">VAT / Company ID (Optional)</label>
            <input type="text" id="cl-vat">

            <div class="checkbox-row" style="margin-top: 15px;">
                <input type="checkbox" id="cl-trade-toggle" onchange="toggleClTrade()">
                <label for="cl-trade-toggle" style="margin:0; cursor:pointer; font-weight: 600;">Show Trade Register Number</label>
            </div>
            <input type="text" id="cl-trade" placeholder="X00/00000/0000" style="margin-top: 5px;" disabled>
        </div>
    </div>

    <h3 style="margin-top: 30px; margin-bottom: 10px;">Line Items</h3>
    <div id="items-container">
        <!-- Rows injected by JS -->
    </div>
    <button type="button" onclick="addItemRow()" style="background: #666; color:white; border:none; border-radius:6px; font-size: 14px; padding: 10px; cursor:pointer;">+ Add Item</button>

    <div style="margin-top: 20px;">
        <label>VAT Rate (%)</label>
        <input type="number" id="vat-rate" value="0" step="0.1" style="width: 100px;">
    </div>
    
    <!-- Layout Toggles -->
    <div class="checkbox-row" style="margin-top: 15px; border-top: 1px solid var(--border); padding-top: 10px;">
        <input type="checkbox" id="toggle-qty" checked onchange="toggleInputs()">
        <label for="toggle-qty" style="margin:0; cursor:pointer; font-weight: 600;">Show Qty Column</label>
    </div>
    <div class="checkbox-row" style="margin-top: 10px;">
        <input type="checkbox" id="toggle-price" checked onchange="toggleInputs()">
        <label for="toggle-price" style="margin:0; cursor:pointer; font-weight: 600;">Show Price Column</label>
    </div>

    <button class="btn-primary" onclick="generateInvoice()">Preview & Generate PDF</button>

    <div style="text-align: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 12px; color: var(--note-text);">
        Invoicing Tool - by © H.O.(OSKi)
    </div>
</div>

<div id="invoice-preview">
    <div class="preview-top-row">
        <div class="preview-left">
            <div class="supplier-name" id="p-sup-name"></div>
            <div id="p-sup-address" style="font-size: 14px; color: #444;"></div>
            <div id="p-sup-city" style="font-size: 14px; color: #444;"></div>
            <div id="p-sup-email" style="font-size: 14px; color: #444; margin-top: 5px;"></div>
            <div id="p-sup-phone" style="font-size: 14px; color: #444;"></div>
            <div id="p-sup-vat" style="font-size: 14px; color: #444; margin-top: 5px;"></div>
            <div id="p-sup-tic" style="font-size: 14px; color: #444;"></div>
        </div>
        <div class="preview-right">
            <div class="preview-title">INVOICE</div>
            <div class="meta-data">
                <strong>Invoice No:</strong> <span id="p-inv-number"></span><br>
                <strong>Date:</strong> <span id="p-inv-date"></span><br>
                <span id="p-due-container"><strong>Due Date:</strong> <span id="p-inv-due"></span></span>
            </div>
            
            <div class="client-data">
                <div class="client-label">Bill To:</div>
                <div style="font-weight: bold; font-size: 16px;" id="p-cl-name"></div>
                <div id="p-cl-address"></div>
                <div id="p-cl-city"></div>
                <div id="p-cl-email"></div>
                <div id="p-cl-phone"></div>
                <div id="p-cl-vat"></div>
                <div id="p-cl-trade"></div>
            </div>
        </div>
    </div>

    <!-- Wrapped Table with fixed header and dynamic body -->
    <div class="table-container">
        <table class="preview-table">
            <thead id="p-table-head">
                <!-- Headers injected by JS -->
            </thead>
            <tbody id="p-items-body" class="table-body-wrapper"></tbody>
        </table>
    </div>

    <!-- Totals aligned under the Total column -->
    <div class="totals-container">
        <table class="totals-table">
            <tr>
                <td class="label">Subtotal:</td>
                <td class="value" id="p-subtotal"></td>
            </tr>
            <tr>
                <td class="label">VAT:</td>
                <td class="value" id="p-vat"></td>
            </tr>
            <tr class="total-final">
                <td class="label">Total:</td>
                <td class="value" id="p-total"></td>
            </tr>
        </table>
    </div>

    <div id="p-signature-block" class="signature-block" style="display: none;">
        <div class="signature-inner">
            <div class="signature-dots"></div>
            <div class="signature-name" id="p-sig-name"></div>
            <div class="signature-title">(SALESMAN)</div>
        </div>
    </div>

    <div class="footer-note">
        Invoicing Tool - by © H.O.
    </div>

    <div style="text-align: center; margin-top: 30px;" class="no-print">
        <button onclick="downloadPDF()" style="width: auto; padding: 12px 30px; background: #27ae60; color:white; border:none; border-radius:6px; font-weight:600; cursor:pointer;">Save as PDF</button>
        <button onclick="sharePDF()" style="width: auto; padding: 12px 30px; background: #8e44ad; color:white; border:none; border-radius:6px; font-weight:600; cursor:pointer;">Share / Email</button>
        <button onclick="printPDF()" style="width: auto; padding: 12px 30px; background: #e67e22; color:white; border:none; border-radius:6px; font-weight:600; cursor:pointer;">Print</button>
        <button onclick="resetApp(false)" style="width: auto; padding: 12px 30px; background: #7f8c8d; color:white; border:none; border-radius:6px; font-weight:600; cursor:pointer; margin-top: 10px;">Back to Edit</button>
    </div>
</div>

<script>
    let invoiceNumberStr = "";
    let hasSavedPdf = false;

    // Initialize Theme
    if (localStorage.getItem('mardikian_theme') === 'dark') {
        document.body.classList.add('dark-mode');
    }

    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        if (document.body.classList.contains('dark-mode')) {
            localStorage.setItem('mardikian_theme', 'dark');
        } else {
            localStorage.setItem('mardikian_theme', 'light');
        }
    }

    window.onload = function() {
        loadSupplierData();
        
        let lastNum = parseInt(localStorage.getItem('mardikian_last_inv_seq')) || 0;
        let nextNum = lastNum + 1;
        let currentYear = new Date().getFullYear();
        
        invoiceNumberStr = `${String(nextNum).padStart(2, '0')}/${currentYear}`;
        document.getElementById('inv-number').value = invoiceNumberStr;
        
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('inv-date').value = today;
        
        const nextMonth = new Date();
        nextMonth.setDate(nextMonth.getDate() + 30);
        document.getElementById('inv-due').value = nextMonth.toISOString().split('T')[0];

        // Load saved currency
        const savedCurrency = localStorage.getItem('mardikian_currency') || '€';
        document.getElementById('currency-select').value = savedCurrency;

        addItemRow();
    }

    function loadSupplierData() {
        const savedSupplier = JSON.parse(localStorage.getItem('mardikian_supplier')) || {};
        document.getElementById('sup-name').value = savedSupplier.name || '';
        document.getElementById('sup-address').value = savedSupplier.address || '';
        document.getElementById('sup-city').value = savedSupplier.city || '';
        document.getElementById('sup-email').value = savedSupplier.email || '';
        document.getElementById('sup-phone').value = savedSupplier.phone || '';
        
        document.getElementById('sup-vat-toggle').checked = savedSupplier.showVat !== false;
        document.getElementById('sup-vat').value = savedSupplier.vat || '';
        
        document.getElementById('sup-tic-toggle').checked = savedSupplier.showTic || false;
        document.getElementById('sup-tic').value = savedSupplier.tic || '';
        
        document.getElementById('sup-signature-toggle').checked = savedSupplier.includeSignature !== false;
        
        toggleSupVat();
        toggleSupTic();
    }

    function toggleDueDate() {
        const isChecked = document.getElementById('toggle-due-date').checked;
        const dueDateInput = document.getElementById('inv-due');
        dueDateInput.disabled = !isChecked;
        dueDateInput.style.opacity = isChecked ? "1" : "0.3";
    }

    function toggleSupVat() {
        const isChecked = document.getElementById('sup-vat-toggle').checked;
        const input = document.getElementById('sup-vat');
        input.disabled = !isChecked;
        input.style.opacity = isChecked ? "1" : "0.3";
    }

    function toggleSupTic() {
        const isChecked = document.getElementById('sup-tic-toggle').checked;
        const input = document.getElementById('sup-tic');
        input.disabled = !isChecked;
        input.style.opacity = isChecked ? "1" : "0.3";
    }

    function toggleClTrade() {
        const isChecked = document.getElementById('cl-trade-toggle').checked;
        const input = document.getElementById('cl-trade');
        input.disabled = !isChecked;
        input.style.opacity = isChecked ? "1" : "0.3";
    }

    function toggleInputs() {
        const showQty = document.getElementById('toggle-qty').checked;
        const showPrice = document.getElementById('toggle-price').checked;
        
        document.querySelectorAll('.item-qty').forEach(input => {
            input.disabled = !showQty;
            input.style.opacity = showQty ? "1" : "0.3";
        });
        
        document.querySelectorAll('.item-price').forEach(input => {
            input.disabled = !showPrice;
            input.style.opacity = showPrice ? "1" : "0.3";
        });

        // If BOTH are hidden, the user wants to enter a flat amount
        const bothHidden = !showQty && !showPrice;
        document.querySelectorAll('.item-total').forEach(input => {
            if (bothHidden) {
                input.readOnly = false;
                input.style.background = "var(--input-bg)"; // Un-gray it
                input.style.opacity = "1";
            } else {
                input.readOnly = true;
                input.style.background = "var(--input-disabled)"; // Gray it out
                input.style.opacity = "1";
                // Recalculate automatically based on Qty * Price
                const row = input.parentElement;
                const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
                const price = parseFloat(row.querySelector('.item-price').value) || 0;
                input.value = (qty * price).toFixed(2);
            }
        });
    }

    function addItemRow() {
        const container = document.getElementById('items-container');
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
            <input type="text" placeholder="Description" class="item-desc">
            <input type="number" placeholder="Qty" value="1" min="1" class="item-qty" oninput="calculateLiveTotals()">
            <input type="number" placeholder="Price" value="0.00" step="0.01" class="item-price" oninput="calculateLiveTotals()">
            <input type="text" class="item-total" value="0.00" readonly style="background:var(--input-disabled); text-align:right;">
            <button class="remove-btn" onclick="this.parentElement.remove()">×</button>
        `;
        container.appendChild(row);
        
        // Apply current toggle state to the new row
        toggleInputs();
    }

    function calculateLiveTotals() {
        const rows = document.querySelectorAll('.item-row');
        rows.forEach(row => {
            const totalInput = row.querySelector('.item-total');
            // Only auto-calculate if the user hasn't unlocked the total field
            if (totalInput.readOnly) {
                const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
                const price = parseFloat(row.querySelector('.item-price').value) || 0;
                totalInput.value = (qty * price).toFixed(2);
            }
        });
    }

    function generateInvoice() {
        const supName = document.getElementById('sup-name').value;
        if(!supName) { alert("Please enter your Supplier Name."); return; }

        // Save Currency
        const currency = document.getElementById('currency-select').value;
        localStorage.setItem('mardikian_currency', currency);
        
        const showQty = document.getElementById('toggle-qty').checked;
        const showPrice = document.getElementById('toggle-price').checked;

        const supplierData = {
            name: supName,
            address: document.getElementById('sup-address').value,
            city: document.getElementById('sup-city').value,
            email: document.getElementById('sup-email').value,
            phone: document.getElementById('sup-phone').value,
            showVat: document.getElementById('sup-vat-toggle').checked,
            vat: document.getElementById('sup-vat').value,
            showTic: document.getElementById('sup-tic-toggle').checked,
            tic: document.getElementById('sup-tic').value,
            includeSignature: document.getElementById('sup-signature-toggle').checked
        };
        localStorage.setItem('mardikian_supplier', JSON.stringify(supplierData));

        // Supplier Details
        document.getElementById('p-sup-name').textContent = supName;
        document.getElementById('p-sup-address').textContent = supplierData.address;
        document.getElementById('p-sup-city').textContent = supplierData.city;
        document.getElementById('p-sup-email').textContent = supplierData.email;
        document.getElementById('p-sup-phone').textContent = supplierData.phone ? "Tel: " + supplierData.phone : "";
        
        document.getElementById('p-sup-vat').textContent = (supplierData.showVat && supplierData.vat) ? "VAT: " + supplierData.vat : "";
        document.getElementById('p-sup-tic').textContent = (supplierData.showTic && supplierData.tic) ? "TIC: " + supplierData.tic : "";

        // Client Details
        document.getElementById('p-cl-name').textContent = document.getElementById('cl-name').value;
        document.getElementById('p-cl-address').textContent = document.getElementById('cl-address').value;
        document.getElementById('p-cl-city').textContent = document.getElementById('cl-city').value;
        document.getElementById('p-cl-email').textContent = document.getElementById('cl-email').value;
        document.getElementById('p-cl-phone').textContent = document.getElementById('cl-phone').value ? "Tel: " + document.getElementById('cl-phone').value : "";
        
        const clVatVal = document.getElementById('cl-vat').value;
        document.getElementById('p-cl-vat').textContent = clVatVal ? "VAT: " + clVatVal : "";
        
        const showClTrade = document.getElementById('cl-trade-toggle').checked;
        const clTradeVal = document.getElementById('cl-trade').value;
        document.getElementById('p-cl-trade').textContent = (showClTrade && clTradeVal) ? "Trade Reg. No. : " + clTradeVal : "";

        // Meta Data
        const invDateRaw = document.getElementById('inv-date').value;
        const invDueRaw = document.getElementById('inv-due').value;
        const manualInvNum = document.getElementById('inv-number').value;
        const showDueDate = document.getElementById('toggle-due-date').checked;
        
        document.getElementById('p-inv-number').textContent = manualInvNum;
        document.getElementById('p-inv-date').textContent = invDateRaw ? invDateRaw.split('-').reverse().join('/') : "";
        
        const dueDateContainer = document.getElementById('p-due-container');
        if (showDueDate && invDueRaw) {
            dueDateContainer.style.display = 'block';
            document.getElementById('p-inv-due').textContent = invDueRaw.split('-').reverse().join('/');
        } else {
            dueDateContainer.style.display = 'none'; 
        }

        // Signature
        const sigBlock = document.getElementById('p-signature-block');
        if(supplierData.includeSignature) {
            sigBlock.style.display = 'flex';
            document.getElementById('p-sig-name').textContent = supName;
        } else {
            sigBlock.style.display = 'none';
        }

        // Update table headers with Currency & layout toggles
        const thead = document.getElementById('p-table-head');
        let headHTML = '<tr>';
        
        let descWidth = '50%';
        if (!showQty && !showPrice) descWidth = '100%';
        else if (!showQty || !showPrice) descWidth = '70%';

        headHTML += `<th style="width: ${descWidth};">Description</th>`;
        
        if (showQty) {
            headHTML += `<th class="right" style="width: 10%;">Qty</th>`;
        }
        if (showPrice) {
            headHTML += `<th class="right" style="width: 20%;">Price ${currency}</th>`;
        }
        headHTML += `<th class="right" style="width: ${showPrice ? '20%' : '30%'};">Amount ${currency}</th>`;
        headHTML += '</tr>';
        thead.innerHTML = headHTML;

        // Items
        const tbody = document.getElementById('p-items-body');
        tbody.innerHTML = '';
        let subtotal = 0;

        document.querySelectorAll('.item-row').forEach(row => {
            const desc = row.querySelector('.item-desc').value;
            const total = parseFloat(row.querySelector('.item-total').value) || 0;

            if(desc || total > 0) {
                subtotal += total;
                let trHTML = '<tr>';
                trHTML += `<td style="width: ${descWidth};">${desc}</td>`;
                
                if (showQty) {
                    const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
                    trHTML += `<td class="right" style="width: 10%;">${qty}</td>`;
                }
                if (showPrice) {
                    const price = parseFloat(row.querySelector('.item-price').value) || 0;
                    trHTML += `<td class="right" style="width: 20%;">${price.toFixed(2)}</td>`;
                }
                trHTML += `<td class="right" style="width: ${showPrice ? '20%' : '30%'};">${total.toFixed(2)}</td>`;
                trHTML += '</tr>';
                tbody.innerHTML += trHTML;
            }
        });

        // Inject a spacer row to stretch the vertical lines to the bottom
        let spacerHTML = '<tr class="spacer-row" style="height: 100%;">';
        spacerHTML += `<td style="width: ${descWidth};"></td>`;
        if (showQty) spacerHTML += '<td style="width: 10%;"></td>';
        if (showPrice) spacerHTML += '<td style="width: 20%;"></td>';
        spacerHTML += `<td style="width: ${showPrice ? '20%' : '30%'};"></td>`;
        spacerHTML += '</tr>';
        tbody.innerHTML += spacerHTML;

        const vatRate = parseFloat(document.getElementById('vat-rate').value) || 0;
        const vatAmount = subtotal * (vatRate / 100);
        const finalTotal = subtotal + vatAmount;

        // Format total values with currency
        document.getElementById('p-subtotal').textContent = subtotal.toFixed(2) + " " + currency;
        document.getElementById('p-vat').textContent = vatAmount.toFixed(2) + " " + currency;
        document.getElementById('p-total').textContent = finalTotal.toFixed(2) + " " + currency;

        document.getElementById('app-form').classList.add('hidden');
        document.getElementById('invoice-preview').style.display = 'block';
        
        hasSavedPdf = false;
        window.scrollTo(0,0);
    }

    function getFilename() {
        const invNum = document.getElementById('inv-number').value.replace(/\//g, '-');
        return `Invoice_${invNum}.pdf`;
    }

    async function createPDFBlob() {
        const original = document.getElementById('invoice-preview');
        const clone = original.cloneNode(true);
        
        const btns = clone.querySelector('.no-print');
        if (btns) btns.remove();
        
        clone.style.display = 'block';
        clone.style.position = 'fixed'; 
        clone.style.top = '0';
        clone.style.left = '0';
        clone.style.zIndex = '-9999'; 
        clone.style.width = '800px';
        clone.style.maxWidth = '800px';
        clone.style.backgroundColor = '#ffffff'; 
        clone.style.color = '#000000';
        clone.style.padding = '40px';
        clone.style.boxShadow = 'none';
        clone.style.margin = '0';

        const topRow = clone.querySelector('.preview-top-row');
        if(topRow) {
            topRow.style.display = 'flex';
            topRow.style.flexDirection = 'row';
            topRow.style.justifyContent = 'space-between';
        }
        const leftCol = clone.querySelector('.preview-left');
        if(leftCol) { leftCol.style.width = '45%'; leftCol.style.textAlign = 'left'; leftCol.style.paddingTop = '45px'; }
        
        const rightCol = clone.querySelector('.preview-right');
        if(rightCol) { 
            rightCol.style.width = '45%'; 
            rightCol.style.marginTop = '0'; 
            rightCol.style.display = 'flex'; 
            rightCol.style.flexDirection = 'column'; 
            rightCol.style.alignItems = 'flex-start'; 
        }
        const metaDataClone = clone.querySelector('.meta-data');
        if(metaDataClone) {
            metaDataClone.style.textAlign = 'left';
        }
        const clientDataClone = clone.querySelector('.client-data');
        if(clientDataClone) {
            clientDataClone.style.textAlign = 'left';
            clientDataClone.style.width = '100%';
        }

        document.body.appendChild(clone);

        const canvas = await html2canvas(clone, { scale: 2, windowWidth: 800 });
        
        const imgData = canvas.toDataURL('image/jpeg', 0.98);
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'pt', 'letter');
        
        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
        
        pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
        
        document.body.removeChild(clone);
        
        return pdf.output('blob');
    }

    async function downloadPDF() {
        try {
            const blob = await createPDFBlob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = getFilename();
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            finalizeInvoiceNumber();
            alert("PDF Downloaded!");
        } catch (err) {
            alert("Error generating PDF: " + err.message);
        }
    }

    async function sharePDF() {
        try {
            const blob = await createPDFBlob();
            const file = new File([blob], getFilename(), { type: 'application/pdf' });
            
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({
                    files: [file],
                    title: `Invoice ${invoiceNumberStr}`,
                    text: `Here is the invoice.`
                });
                finalizeInvoiceNumber();
            } else {
                alert("Your device doesn't support direct sharing. The PDF has been downloaded to your device instead.");
                await downloadPDF();
            }
        } catch (err) {
            if (err.name !== 'AbortError') {
                alert("Error sharing PDF: " + err.message);
            }
        }
    }

    function printPDF() {
        window.print();
        finalizeInvoiceNumber();
    }

    function finalizeInvoiceNumber() {
        if (hasSavedPdf) return;
        hasSavedPdf = true;
        let lastNum = parseInt(localStorage.getItem('mardikian_last_inv_seq')) || 0;
        localStorage.setItem('mardikian_last_inv_seq', lastNum + 1);
    }

    function resetApp(fullReset = false) {
        if (!fullReset) {
            if(!hasSavedPdf && !confirm("You haven't downloaded the PDF yet. Go back to edit?")) {
                return;
            }
        } else {
            if(!confirm("Are you sure you want to reset all fields and clear the invoice number? This cannot be undone.")) {
                return;
            }
            localStorage.removeItem('mardikian_supplier');
            localStorage.removeItem('mardikian_last_inv_seq');
            localStorage.removeItem('mardikian_currency');
            window.location.reload();
            return;
        }

        document.getElementById('invoice-preview').style.display = 'none';
        document.getElementById('app-form').classList.remove('hidden');
        
        document.getElementById('cl-name').value = '';
        document.getElementById('cl-address').value = '';
        document.getElementById('cl-city').value = '';
        document.getElementById('cl-email').value = '';
        document.getElementById('cl-phone').value = '';
        document.getElementById('cl-vat').value = '';
        document.getElementById('cl-trade').value = '';
        document.getElementById('cl-trade-toggle').checked = false;
        toggleClTrade();
        
        document.getElementById('items-container').innerHTML = '';
        addItemRow();

        let lastNum = parseInt(localStorage.getItem('mardikian_last_inv_seq')) || 0;
        let nextNum = lastNum + 1;
        let currentYear = new Date().getFullYear();
        document.getElementById('inv-number').value = `${String(nextNum).padStart(2, '0')}/${currentYear}`;
        
        window.scrollTo(0,0);
    }

    const style = document.createElement('style');
    style.innerHTML = `@media print { .no-print { display: none !important; } body { background: white; } }`;
    document.head.appendChild(style);
</script>
